name: Deploy to cPanel

on:
  push:
    branches:
      - main # Ganti dengan nama branch Anda jika berbeda (misal: master)

jobs:
  web-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies, Build, and ZIP
        run: |
          npm ci
          npm run build
          mkdir deploy_package
          mkdir deploy_package/seo-app
          rsync -av --exclude 'deploy_package' --exclude 'public' --exclude '.git' --exclude '.github' ./ deploy_package/seo-app/
          rsync -av public/ deploy_package/
          
          # Bungkus jadi 1 file ZIP
          cd deploy_package
          zip -rq ../deploy.zip .
          cd ..
          
          # Siapkan folder khusus untuk FTP upload
          mkdir ftp_upload
          mv deploy.zip ftp_upload/

      - name: Upload ZIP via FTP (Super Cepat)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ftp_upload/
          server-dir: public_html/

      - name: Trigger Auto-Unzip di Server
        run: |
          curl -sS "https://seochecker.my.id/deploy-unzip.php?token=RAHASIA_SUPER_KUAT_123"
